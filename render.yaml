services:
  - type: web
    name: nvda-trade-simulation-backend
    runtime: python
    region: oregon
    plan: starter
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT --workers 1 --limit-concurrency 50 --backlog 128
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
